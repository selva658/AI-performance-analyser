<div class="page-wrapper">
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="login-card">
    <span class="eyebrow"><i-lucide [img]="icons.Sparkles" [size]="12"></i-lucide> AthleteIQ</span>
    <h1>Sign in</h1>
    <p class="subtitle">Coaches and players both sign in here.</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Email" autocomplete="username" />
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" autocomplete="current-password" />
      </label>

      <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

      <button type="submit" class="login-btn" [disabled]="!email.trim() || !password || loading">
        <i-lucide [img]="icons.LogIn" [size]="16"></i-lucide>
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
